# Render Blueprint: New + -> Blueprint -> select this repo.
services:
  - type: web
    name: fit4u
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_KEY
        generateValue: true
      - key: GENAI_MODEL
        value: gemini-2.5-flash
      - key: GENAI_KEY
        sync: false
      - key: SPOONACULAR_KEY
        sync: false
